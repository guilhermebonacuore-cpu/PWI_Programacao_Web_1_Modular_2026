<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário em HTML</title>
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <h1>Formulário em HTML</h1>

    <form action="#" method="post">

<fieldset>
    <Legend>Cadastro do Usuário</Legend>
    
<label for="nomeUser">Informe o Nome do Usuário</label>
        <input type="text" id="nomeUser" name="Nome" placeholder="Escreva Seu Nome">
<br></br> 

<label for=""> Email de Contato</label> <!-- toda Tag LABEL é amarrada em uma Tag IMPUT-->
    <input type="email" id="UserEmail" name="Email" required placeholder="Digite Seu Email">   
<br></br>

<label for="UserSenha"> Senha</label>
    <input type="password" name="Senha" id="UserSenha" required>
 <label for="userContato">Contato:</label>
    <input type="tel" required id="userContato" pattern="[0-9]{2} [0-9] [9]" placeholder="11 XXXXX-XXXX"    >
<br></br>

<label for="userSexo">Selecione seu Gênero Biológico</label>
<br>

    <input type="radio" required id="Masc" value="Masculino">
<label for="Masc">Masculino</label>
<br>

<input type="radio" required id="Fem" value="Feminino">
<label for="Fem">Feminino</label>

    
</fieldset>
<button type="submit">Enviar Dados</button>

 </form>
</body>
</html>
